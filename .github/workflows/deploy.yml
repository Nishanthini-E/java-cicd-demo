name: Docker CI/CD to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Build JAR
      run: mvn clean package

    # 🐳 Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 🐳 Build image
    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/java-cicd-demo .

    # 🐳 Push image
    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/java-cicd-demo

    # 🚀 Deploy on EC2
    - name: Deploy on EC2
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          echo "Pulling latest image..."
          docker pull ${{ secrets.DOCKER_USERNAME }}/java-cicd-demo

          echo "Stopping old container..."
          docker stop java-app || true
          docker rm java-app || true

          echo "Running new container..."
          docker run -d -p 3000:3000 --name java-app ${{ secrets.DOCKER_USERNAME }}/java-cicd-demo

          echo "Deployment complete"
