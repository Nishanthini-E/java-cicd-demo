name: Java CI/CD to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Build with Maven
      run: mvn clean package
      

    - name: Copy JAR to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: "java-cicd-demo/target/*.jar"
        target: "/home/ubuntu/"
        
    - name: Verify JAR copied
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
            echo "Checking JAR:"
            ls -l /home/ubuntu/java-cicd-demo/target/*.jar

    - name: Run app on EC2
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
            echo "===== START ====="
      
            echo "Current directory:"
            pwd
      
            echo "Files in /home/ubuntu:"
            ls -l /home/ubuntu/java-cicd-demo/target
      
            echo "Java version:"
            java -version
      
            echo "Killing old app..."
            pkill -f java || true
            sleep 2
      
            echo "Starting new app..."
            cd /home/ubuntu/java-cicd-demo/target
      
            nohup java -cp java-cicd-demo-1.0-SNAPSHOT.jar com.demo.App > app.log 2>&1 &
      
            echo "App started"
            echo "===== END ====="


