name: Java CI/CD to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    # ✅ Build (root project)
    - name: Build with Maven
      run: mvn clean package

    # ✅ Copy JAR to EC2
    - name: Copy JAR to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: "target/*.jar"
        target: "/home/ubuntu/"

    # ✅ Deploy & Run
    - name: Run app on EC2
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          echo "===== START ====="

          echo "Listing files in /home/ubuntu:"
          ls -l /home/ubuntu

          echo "Java version:"
          java -version

          echo "Stopping old app safely..."
          ps -ef | grep java | grep -v grep | awk '{print $2}' | xargs -r kill -9

          sleep 2

          echo "Starting new app..."
          cd /home/ubuntu

          nohup java -jar java-cicd-demo-1.0-SNAPSHOT.jar > app.log 2>&1 &

          echo "App started successfully"
          echo "===== END ====="
